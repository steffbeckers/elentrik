name: elentrik

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: elentrik
      POSTGRES_PASSWORD: elentrik
      POSTGRES_DB: elentrik
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elentrik -d elentrik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
