name: elentrik

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: elentrik
      POSTGRES_PASSWORD: elentrik
      POSTGRES_DB: elentrik
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elentrik -d elentrik"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    restart: unless-stopped
    # Korter dan de 60 s van de client (gotenberg.ts): zo krijgt de app de foutmelding van Gotenberg vóór haar eigen time-out afloopt.
    command: ["gotenberg", "--api-timeout=55s"]
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Vangt alle uitgaande mail lokaal op: SMTP op 1025, web-UI en API op 8025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
