name: elentrik

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: elentrik
      POSTGRES_PASSWORD: elentrik
      POSTGRES_DB: elentrik
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elentrik -d elentrik"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    restart: unless-stopped
    # Ruimer dan de 60 s van de client (gotenberg.ts): zo vuurt de time-out van de client eerst.
    command: ["gotenberg", "--api-timeout=65s"]
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
