name: web-image

# De tests draaien alleen voor `develop` (elke PR ernaartoe en elke push). `staging` en `main` krijgen
# alleen merges van de vorige branch, met dezelfde inhoud die op `develop` al getest is: daar bouwt de
# workflow alleen het image.
on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [develop]

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Geen `version:`: de actie leest pnpm uit `packageManager` in de root-package.json (zelfde versie als
      # in apps/web/Dockerfile). Twee verschillende versies zouden de stap laten falen.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # De postinstall van apps/web draait `nuxt prepare`, nodig voor `nuxt typecheck`.
      - run: pnpm install --frozen-lockfile

      # Zonder de prestatietests (`pnpm test:prestatie`): de drempels van 20/50 ms zijn te tijdgevoelig voor
      # gedeelde CI-runners. Die controle blijft lokaal.
      - run: pnpm test:parallel

      - run: pnpm typecheck

  image:
    # Alleen `main` (productie) en `staging` bouwen een image; `develop` draait alleen de tests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `write`: na een geslaagde build op `main` zet de job de versietag vX.Y.Z.
      contents: write
      packages: write
    steps:
      # De volledige geschiedenis met de tags: de versie volgt uit de commits sinds de hoogste tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # De semver uit de Conventional Commits sinds de hoogste tag vX.Y.Z (apps/web/shared/semver.ts):
      # breaking → major, feat → minor, anders patch. Staging krijgt de komende versie met `-staging`.
      - name: Versie bepalen
        id: versie
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          versie="$(node apps/web/scripts/versie.ts)"
          case "$REF_NAME" in
            main) ;;
            staging) versie="${versie}-staging" ;;
            *)
              echo "Geen versie voor deze branch" >&2
              exit 1
              ;;
          esac
          echo "Versie: ${versie}"
          echo "versie=${versie}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De tags volgen uit de exacte branchnaam; elke andere waarde laat de stap falen. De branchnaam
      # gaat via `env` naar het script, nooit rechtstreeks in de scripttekst.
      - name: Tags bepalen
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSIE: ${{ steps.versie.outputs.versie }}
        run: |
          kort="${GITHUB_SHA::7}"
          case "$REF_NAME" in
            main) hoofdtag=latest ;;
            staging) hoofdtag=staging ;;
            *)
              echo "Geen image voor deze branch" >&2
              exit 1
              ;;
          esac
          {
            echo "tags<<EOF_TAGS"
            echo "ghcr.io/steffbeckers/elentrik-web:${hoofdtag}"
            echo "ghcr.io/steffbeckers/elentrik-web:sha-${kort}"
            # Productie ook onder zijn versie, bv. :1.1.0.
            if [ "$REF_NAME" = main ]; then echo "ghcr.io/steffbeckers/elentrik-web:${VERSIE}"; fi
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            ELENTRIK_VERSIE=${{ steps.versie.outputs.versie }}
            ELENTRIK_REVISIE=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/steffbeckers/elentrik
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.versie.outputs.versie }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pas na een geslaagde push van het image: de tag vX.Y.Z op deze commit, zodat de volgende versie
      # vanaf hier telt. Bestaat de tag al (geen nieuwe commits sinds de vorige release), dan niets. Een
      # lichtgewicht tag, geen GitHub Release. Een push met GITHUB_TOKEN start geen nieuwe workflow.
      - name: Versietag zetten
        if: github.ref == 'refs/heads/main'
        env:
          VERSIE: ${{ steps.versie.outputs.versie }}
        run: |
          tag="v${VERSIE}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} bestaat al"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
