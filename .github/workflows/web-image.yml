name: web-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Zelfde pnpm als in apps/web/Dockerfile (de root-package.json heeft geen `packageManager`).
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # De postinstall van apps/web draait `nuxt prepare`, nodig voor `nuxt typecheck`.
      - run: pnpm install --frozen-lockfile

      # Zonder de prestatietests (`pnpm test:prestatie`): de drempels van 20/50 ms zijn te tijdgevoelig voor
      # gedeelde CI-runners. Die controle blijft lokaal.
      - run: pnpm test:parallel

      - run: pnpm typecheck

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Korte sha bepalen
        id: sha
        run: echo "kort=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/steffbeckers/elentrik-web:latest
            ghcr.io/steffbeckers/elentrik-web:sha-${{ steps.sha.outputs.kort }}
          labels: |
            org.opencontainers.image.source=https://github.com/steffbeckers/elentrik
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
